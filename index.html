<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f2eb">
<title>Skripte</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='5' fill='%23a8401f'/%3E%3Crect x='5' y='5' width='6' height='6' rx='1' fill='%23fffaf5'/%3E%3Cpath d='M13.5 6.5h5M13.5 9.5h5M5.5 14h13M5.5 17.5h8' stroke='%23fffaf5' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --paper: #f5f2eb; --panel: #fffdf9; --panel-2: #f9f6f0; --ink: #1c1a16; --ink-2: #3a362f; --muted: #6d675c; --faint: #9a9386;
  --line: #e4ded2; --line-2: #d4ccbd; --accent: #a8401f; --accent-ink: #fffaf5; --accent-soft: #f6e6dd;
  --att: #b26a00; --att-soft: #fbeed8; --ver: #22647f; --ver-soft: #e0eef4; --akt: #2c7a4b; --akt-soft: #e1f1e6; --red: #b4332b;
  --serif: "Iowan Old Style", "Charter", "Cambria", Georgia, serif;
  --sans: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; padding: env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
header { display: flex; align-items: center; gap: 10px; padding: 18px 0 6px; }
header svg { width: 26px; height: 26px; flex: none; }
header b { font: 600 22px/1 var(--serif); }
header .stand { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
.kunde { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 22px 0 8px; }
details.plan { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
details.plan > summary { list-style: none; padding: 14px 16px; display: flex; align-items: baseline; gap: 10px; }
details.plan > summary::-webkit-details-marker { display: none; }
details.plan > summary h2 { font: 600 19px/1.25 var(--serif); margin: 0; }
details.plan > summary span { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
.fokus { font: italic 16px/1.45 var(--serif); color: var(--ink-2); padding: 0 16px 12px; margin: 0; }
.idea { border-top: 1px solid var(--line); padding: 16px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 650; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.badge.emotion { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.badge.Aufmerksamkeit { background: var(--att-soft); color: var(--att); border-color: transparent; }
.badge.Vertrauen { background: var(--ver-soft); color: var(--ver); border-color: transparent; }
.badge.Besuch, .badge.Anfrage { background: var(--akt-soft); color: var(--akt); border-color: transparent; }
.idea h3 { font: 600 18px/1.3 var(--serif); margin: 0 0 10px; }
.hook { font: 600 20px/1.35 var(--serif); padding: 4px 0 4px 14px; border-left: 3px solid var(--accent); margin: 0 0 12px; }
.lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.txt { margin: 0; }
ul.ablauf { margin: 0; padding-left: 20px; }
ul.ablauf li { margin: 4px 0; }
.shots { display: grid; gap: 6px; }
.shot { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); text-align: left; width: 100%; }
.shot .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line-2); flex: none; display: grid; place-items: center; margin-top: 1px; background: #fff; }
.shot.done { background: var(--akt-soft); border-color: transparent; }
.shot.done .box { background: var(--akt); border-color: var(--akt); }
.shot.done .box::after { content: ""; width: 10px; height: 6px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.shot.done span:last-child { color: var(--muted); text-decoration: line-through; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.caption { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.note { border-radius: 10px; padding: 14px; background: var(--panel); border: 1px solid var(--line); margin-top: 20px; }
.note.err { background: #f8e3e0; border-color: #ecc0bb; color: #7d231d; }
.note input { width: 100%; margin: 10px 0; padding: 10px; border: 1px solid var(--line-2); border-radius: 8px; font: 14px monospace; }
.leer { color: var(--muted); text-align: center; padding: 40px 0; }
footer { text-align: center; margin-top: 30px; font-size: 13px; color: var(--muted); }
footer button { border: 0; background: none; color: var(--muted); text-decoration: underline; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="5" fill="#a8401f"/><rect x="5" y="5" width="6" height="6" rx="1" fill="#fffaf5"/><path d="M13.5 6.5h5M13.5 9.5h5M5.5 14h13M5.5 17.5h8" stroke="#fffaf5" stroke-width="1.8" stroke-linecap="round"/></svg>
    <b>Skripte</b>
    <span class="stand" id="stand"></span>
  </header>
  <main id="main"><p class="leer">Lädt …</p></main>
  <footer id="foot" hidden><button id="reload">Neu laden</button> · <button id="forget">Schlüssel vom Handy löschen</button></footer>
</div>
<script>
// Redaktion: Skripte fürs Handy. Inhalt liegt verschlüsselt in daten.json (AES-256-GCM).
// Der Schlüssel kommt einmal per QR-Link (#k=…) und bleibt nur auf diesem Gerät.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const KEY = 'redaktion.schluessel', CACHE = 'redaktion.daten';

const m = location.hash.match(/k=([\w-]+)/);
if (m) { store.set(KEY, m[1]); history.replaceState(null, '', location.pathname + location.search); }

function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 1800); }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64url = s => b64(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));

async function entschluesseln(paket, keyText) {
  const key = await crypto.subtle.importKey('raw', b64url(keyText), 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(paket.iv) }, key, b64(paket.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function schluesselFehlt(text) {
  $('#main').innerHTML = `<div class="note ${text ? 'err' : ''}">
    <b>${text || 'Noch kein Schlüssel auf diesem Handy.'}</b>
    <p>Am PC in der Redaktion auf „Handy-Zugang“ klicken und den QR-Code mit der Kamera scannen. Oder den Schlüssel hier einfügen:</p>
    <input id="keyIn" placeholder="Schlüssel" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn primary" id="keySave">Speichern</button></div>`;
  $('#keySave').onclick = () => { const v = $('#keyIn').value.trim().replace(/^.*k=/, ''); if (v) { store.set(KEY, v); laden(); } };
}

const shotKey = (plan, idee, i) => `redaktion.shot.${plan}.${idee}.${i}`;

function render(d) {
  $('#stand').textContent = 'Stand ' + new Date(d.stand).toLocaleString('de-DE', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
  if (!d.kunden.length) { $('#main').innerHTML = '<p class="leer">Noch kein freigegebener Wochenplan. Am PC einen Plan freigeben, dann erscheint er hier.</p>'; return; }
  let first = true;
  $('#main').innerHTML = d.kunden.map(k => `
    <div class="kunde">Kunde ${k.nr} · ${esc(k.name)}${k.status === 'trockenlauf' ? ' · Trockenlauf' : ''}</div>
    ${[...k.plaene].sort((a, b) => b.id.localeCompare(a.id)).map(pl => {
      const open = first; first = false;
      return `<details class="plan" ${open ? 'open' : ''}><summary><h2>${esc(pl.woche.replace(/\s*\(.*\)$/, ''))}</h2><span>${esc((pl.woche.match(/\((.*)\)/) || [])[1] || '')}</span></summary>
        ${pl.fokus ? `<p class="fokus">${esc(pl.fokus)}</p>` : ''}
        ${pl.ideen.map((x, n) => `<section class="idea">
          <div class="tags">${x.emotion ? `<span class="badge emotion">${esc(x.emotion)}</span>` : ''}<span class="badge ${esc(x.funnel)}">${esc(x.funnel)}</span><span class="badge">${esc(x.aufwand)}</span>${x.serie ? `<span class="badge">${esc(x.serie)}</span>` : ''}</div>
          <h3>${n + 1}. ${esc(x.titel)}</h3>
          <p class="hook">${esc(x.hook)}</p>
          ${x.ausloeser ? `<div class="lbl">Auslöser</div><p class="txt">${esc(x.ausloeser)}</p>` : ''}
          <div class="lbl">Idee</div><p class="txt">${esc(x.idee)}</p>
          <div class="lbl">Ablauf</div><ul class="ablauf">${x.skript.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
          <div class="lbl">Shots</div><div class="shots">${x.shotliste.map((s, i) => {
            const done = store.get(shotKey(pl.id, x.id, i)) === '1';
            return `<button class="shot ${done ? 'done' : ''}" data-shot="${esc(shotKey(pl.id, x.id, i))}"><span class="box"></span><span>${esc(s)}</span></button>`;
          }).join('')}</div>
          <div class="lbl">Caption</div><div class="caption">${esc(x.caption)}</div>
          <div class="row"><button class="btn" data-copy="${esc(x.caption)}">Caption kopieren</button>${x.vorbild ? `<a class="btn" href="${esc(x.vorbild.url)}" target="_blank" rel="noopener">Vorbild ansehen</a>` : ''}</div>
        </section>`).join('')}
      </details>`;
    }).join('')}`).join('');
}

document.addEventListener('click', async e => {
  const s = e.target.closest('[data-shot]');
  if (s) { const on = !s.classList.contains('done'); s.classList.toggle('done', on); on ? store.set(s.dataset.shot, '1') : store.del(s.dataset.shot); return; }
  const c = e.target.closest('[data-copy]');
  if (c) { try { await navigator.clipboard.writeText(c.dataset.copy); toast('Kopiert'); } catch { toast('Kopieren ging nicht'); } }
});
$('#reload').onclick = () => laden();
$('#forget').onclick = () => { if (confirm('Schlüssel und gespeicherte Skripte von diesem Handy löschen?')) { store.del(KEY); store.del(CACHE); schluesselFehlt(); } };

async function laden() {
  const key = store.get(KEY);
  if (!key) return schluesselFehlt();
  $('#foot').hidden = false;
  let paket = null, offline = false;
  try {
    const r = await fetch('daten.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    paket = await r.json();
    store.set(CACHE, JSON.stringify(paket));
  } catch {
    const c = store.get(CACHE);
    if (c) { paket = JSON.parse(c); offline = true; }
  }
  if (!paket) { $('#main').innerHTML = '<div class="note err">Keine Verbindung und nichts gespeichert. Später nochmal versuchen.</div>'; return; }
  try {
    const d = await entschluesseln(paket, key);
    render({ ...d, stand: paket.stand });
    if (offline) toast('Offline: zuletzt gespeicherte Fassung');
  } catch {
    schluesselFehlt('Der Schlüssel passt nicht. QR-Code am PC neu scannen.');
  }
}
laden();
</script>
</body>
</html>
